<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="tela.css">
</head>
<body>

    <div id="loginScreen" class="login-card">
        <div class="product-name">NEXUS CORE</div>
        <div class="product-subtitle">Painel de Controlo</div>

        <div id="errorMessage" class="error-message hidden">
            ⚠️ Senha preenchida errada ou utilizador inválido!
        </div>

        <form id="loginForm" action="/login" method="POST">
    <div class="form-group">
        <label for="username">Login / Utilizador</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Introduza o utilizador" required autocomplete="username">
    </div>

    <div class="form-group">
        <label for="password">Senha / Palavra-passe</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Introduza a senha" required autocomplete="current-password">
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">Entrar no Sistema</button>
        </form>
    </div>

    <div id="sessionScreen" class="fullscreen-session hidden">
        <div class="session-overlay"></div>
        
        <div class="session-content">
            <h1 class="session-title">NEXUS CORE</h1>
            <p id="sessionUser" class="session-user"></p>
        </div>

        <button id="logoutBtn" class="logout-btn">Encerrar Sessão</button>
    </div>

    <script src="tela.js"></script>
</body>
</html>
